name: Release

on:
  schedule:
    - cron: "0 14 * * 5"

permissions:
  contents: read

jobs:
  release:
    name: Release
    # semantic-release publie tags, release GitHub et commentaires.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ${{ vars.SNU_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@5982a02995853159735cb838992248c4f0f16166 # v2
        with:
          semantic_version: 17
          extra_plugins: |
            @semantic-release/changelog@5.0.1
            @semantic-release/git@9.0.0
          branches: |
            [
              '+([0-9])?(.{+([0-9]),x}).x',
              'main',
              'next',
              {name: 'beta', prerelease: true},
              {name: 'alpha', prerelease: true}
            ]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
