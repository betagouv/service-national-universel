name: Run tests

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - production

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ${{ vars.SNU_RUNNER || 'ubuntu-latest' }}
    outputs:
      test_matrix: ${{ steps.config.outputs.test }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Get matrices configuration
        id: config
        # Nom de branche passé par variable d'environnement, jamais interpolé dans le script.
        env:
          REF: ${{ github.ref_name }}
        run: |
          # TEST MATRIX
          git switch main

          echo "[]" \
          | jq  '. + [{name:"api", run_test:$tag}]' --arg tag "$(git log --max-count=1 --oneline "main..$REF" -- api packages/lib packages/log-redaction package-lock.json .github/actions/run-tests-api | cut -d " " -f 1)" \
          | jq  '. + [{name:"apiv2", run_test:$tag}]' --arg tag "$(git log --max-count=1 --oneline "main..$REF" -- apiv2 packages/lib packages/log-redaction package-lock.json .github/actions/run-tests-apiv2 | cut -d " " -f 1)" \
          | jq  '. + [{name:"app", run_test:$tag}]' --arg tag "$(git log --max-count=1 --oneline "main..$REF" -- app packages package-lock.json .github/actions/run-tests-app | cut -d " " -f 1)" \
          | jq  '. + [{name:"admin", run_test:$tag}]' --arg tag "$(git log --max-count=1 --oneline "main..$REF" -- admin packages package-lock.json .github/actions/run-tests-admin | cut -d " " -f 1)" \
          | jq  '. + [{name:"lib", run_test:$tag}]' --arg tag "$(git log --max-count=1 --oneline "main..$REF" -- packages package-lock.json .github/actions/run-tests-lib | cut -d " " -f 1)" > test.json

          echo "Test matrix"
          cat test.json
          echo "test=$(jq -c < test.json)" >> $GITHUB_OUTPUT

  test:
    needs: prepare
    runs-on: ${{ vars.SNU_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Run tests
        uses: jenseng/dynamic-uses@8bc24f0360175e710da532c4d19eafdbed489a06 # v1
        if: ${{matrix.app.run_test}}
        with:
          uses: ./.github/actions/run-tests-${{matrix.app.name}}
          with: '{"branch_name": ${{ toJSON(github.ref_name) }}}'