name: Test Environment - Stop (CRON)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 5" # Every friday at 15:00

permissions:
  contents: read

jobs:
  stop:
    # Retire le label deploy des PR ouvertes.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    environment: recette
    runs-on: ${{ vars.SNU_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Unlabel open PRs with deploy label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s \
            -H "Content-Type: application/json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/search/issues?q=is:open+is:pr+label:deploy+repo:betagouv/service-national-universel" \
          | jq -r '.items[].labels_url' | sed 's#{/name}#/deploy#g' \
          | xargs -r -n 1 curl -X DELETE -H "Authorization: token $GITHUB_TOKEN"


      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # clever-tools 5 exige Node 24+ : on ne dépend pas du Node (ou de son absence) du runner.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install clever-tools
        run: npm install --global --ignore-scripts clever-tools@5.0.2

      - name: Stop all environments prefixed by "env-"
        env:
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
        run: |
          ./devops/scripts/cc-list-environments.sh ${{ vars.CC_ORGANIZATION_ID }} \
          | xargs -r -n 1 --verbose clever stop --app
