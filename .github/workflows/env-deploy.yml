name: Test Environment - Deploy

# Les secrets Clever de l'environnement « recette » ne sont servis qu'aux runs de
# `main` (règle de branche de l'environnement). Le workflow est donc toujours lu sur
# `main` : `pull_request_target` plutôt que `pull_request` (dont la ref est
# `refs/pull/N/merge` et dont le fichier de workflow vient de la PR), et un
# déclenchement manuel lancé depuis `main` qui nomme la branche à déployer.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branche à déployer en recette"
        required: true
        type: string
  pull_request_target:
    types: [ labeled, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || inputs.branch }}
  cancel-in-progress: true

# Jeton GitHub en lecture seule par défaut ; chaque job déclare ce qu'il lui faut en plus.
permissions:
  contents: read

env:
  # Noms de branche et SHA transmis au shell par variable d'environnement, jamais
  # interpolés dans un `run:` : un nom de branche peut contenir `$(...)`.
  BRANCH_NAME: ${{ github.event.pull_request.head.ref || inputs.branch }}
  # Vide en déclenchement manuel : résolu plus bas sur la tête de la branche.
  SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  deploy:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # Porte les secrets Clever de l'environnement GitHub « recette ».
    environment: recette
    runs-on: ${{ vars.SNU_RUNNER || 'ubuntu-latest' }}
    # PR d'un fork exclues : `pull_request_target` leur servirait les secrets, et Clever
    # construit la branche du même nom sur ce dépôt, pas celle du fork.
    if: |
      (github.event_name=='pull_request_target' && contains(github.event.pull_request.labels.*.name, 'deploy') &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name=='workflow_dispatch' && inputs.branch != 'production' && inputs.branch != 'main')

    steps:
      # Les scripts qui reçoivent CLEVER_TOKEN/CLEVER_SECRET viennent de la branche par
      # défaut, jamais de la branche proposée : la PR ne peut pas les réécrire. Clever
      # Cloud construit ensuite l'application depuis la branche, sans ces secrets.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # clever-tools 5 exige Node 24+ : on ne dépend pas du Node (ou de son absence) du runner.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install clever-tools
        run: npm install --global --ignore-scripts clever-tools@5.0.2

      # Correspondance exacte sur la ref : `git ls-remote` filtre par suffixe.
      - name: Resolve branch head
        if: github.event_name=='workflow_dispatch'
        run: |
          sha=$(git ls-remote --heads origin | awk -v ref="refs/heads/$BRANCH_NAME" '$2 == ref { print $1 }')
          [ -n "$sha" ] || { echo "Branche introuvable : $BRANCH_NAME" >&2; exit 1; }
          echo "SHA=$sha" >> "$GITHUB_ENV"

      - name: Create and Start application
        env:
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
          CC_ORGANIZATION_ID: ${{ vars.CC_ORGANIZATION_ID }}
          CC_APP_ID_CI_SNU_ALL: ${{ vars.CC_APP_ID_CI_SNU_ALL }}
        run: ./devops/scripts/cc-create-environment.sh "$CC_ORGANIZATION_ID" "$CC_APP_ID_CI_SNU_ALL" "$BRANCH_NAME" "$SHA"

      - name: Find Comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        id: fc
        if: github.event_name=='pull_request_target'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Application endpoints

      - name: Get environment name
        id: env
        if: github.event_name=='pull_request_target' && steps.fc.outputs.comment-id == ''
        run: |
          name=$(./devops/scripts/cc-environment-name.sh "$BRANCH_NAME")
          echo "name: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create comment
        if: github.event_name=='pull_request_target' && steps.fc.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Application endpoints :

            - api : https://api.${{ steps.env.outputs.name }}.ci.beta-snu.dev
            - admin : https://admin.${{ steps.env.outputs.name }}.ci.beta-snu.dev
            - moncompte : https://moncompte.${{ steps.env.outputs.name }}.ci.beta-snu.dev

          reactions: rocket
