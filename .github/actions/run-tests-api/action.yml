name: API - Run Tests

inputs:
  branch_name:
    description: "Branch name"
    required: true

runs:
  using: "composite"
  steps:
    # Les runners sont auto-hébergés et réutilisés d'un job à l'autre. Un job tué en cours
    # de route — runner qui perd la communication, annulation — laisse derrière lui un
    # conteneur nommé "mongodb", et tous les jobs suivants sur cette machine échouent alors
    # au démarrage de MongoDB ("Conflict. The container name /mongodb is already in use"),
    # sans jamais exécuter un test. On retire donc le résidu avant de démarrer.
    - name: Remove stale MongoDB container
      shell: bash
      run: |
        # Chaque runner a son propre demon Docker (dind) et n'execute qu'un job a la
        # fois : un conteneur "mongodb" present ici est forcement un residu du job
        # precedent, jamais la base d'un job concurrent. On le supprime donc sans
        # condition, qu'il tourne ou non -- l'action --rm ne le retire qu'a sa sortie,
        # et il reste vivant apres la fin du job.
        docker rm -f mongodb 2>/dev/null || true

    - name: Start MongoDB 7.0
      uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
      with:
        mongodb-version: "7.0"
        mongodb-replica-set: "rs0"

    - uses: ./.github/actions/setup-workspace
      with:
        branch_name: ${{ inputs.branch_name }}
        build: lib log-redaction

    - name: Lint code
      working-directory: api
      shell: bash
      run: npm run lint

    - name: Run tests
      working-directory: api
      shell: bash
      # Chaque fichier de test peut faire grimper un worker au-delà du heap V8
      # par défaut (~2 Go) -> heap OOM puis SIGTERM en cascade. On exécute donc
      # en un seul worker (--maxWorkers=1 dans le script) avec un heap relevé,
      # tout en restant sous les 7 Go de RAM du runner ubuntu-latest.
      env:
        NODE_OPTIONS: --max-old-space-size=4096
      run: npm run test
