name: Front applications - Run Tests

inputs:
  branch_name:
    description: "Branch name"
    required: true

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-workspace
      with:
        branch_name: ${{ inputs.branch_name }}
        # log-redaction : app/src/sentry.js l'importe (redactFrontBreadcrumb/Event), nécessaire
        # dès que "npm run test" charge ce module (GOO-185/GOO-194).
        build: lib ds log-redaction

    - name: Check types
      working-directory: app
      shell: bash
      run: npm run check-types

    - name: Lint code
      working-directory: app
      shell: bash
      run: npm run lint

    - name: Run tests
      working-directory: app
      shell: bash
      run: npm run test
