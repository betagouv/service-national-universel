name: APIv2 - Run Tests

inputs:
  branch_name:
    description: "Branch name"
    required: true

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-workspace
      with:
        branch_name: ${{ inputs.branch_name }}
        # apiv2 importe @snu/log-redaction (redaction avant envoi a Sentry) : sans son dist,
        # toute suite qui charge le filtre d'exception ou le provider Sentry echoue en TS2307.
        build: lib log-redaction

    - name: Run tests
      working-directory: apiv2
      shell: bash
      # jest --runInBand exécute toute la suite dans un seul process : la mémoire
      # s'accumule et dépasse le heap par défaut (~2 Go) -> OOM (exit 134).
      # On augmente le heap (runner ubuntu-latest = 7 Go de RAM).
      env:
        NODE_OPTIONS: --max-old-space-size=4096
      run: npm test
