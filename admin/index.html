<!doctype html>
<html lang="fr" class="notranslate" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="google" content="notranslate" />
    <title>Service National Universel</title>
    <script defer data-domain="admin.snu.gouv.fr" src="https://plausible.io/js/script.manual.outbound-links.file-downloads.js"></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          (window.plausible.q = window.plausible.q || []).push(arguments);
        };
    </script>
    <script>
      // Ni query string ni fragment (jetons, termes de recherche) ; identifiants et jetons hexadécimaux remplacés par ":id"
      var redactedUrl = (window.location.origin + window.location.pathname).replace(/[0-9a-fA-F]{24,}/g, ":id");
      // Send the pageview event to Plausible
      plausible("pageview", { u: redactedUrl });
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
