daemon off;
error_log stderr;
pid $APP_HOME/nginx.pid;
worker_processes auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    access_log off;
    server_tokens off;

    # Cache navigateur : même bloc dans devops/build/all/nginx.conf.
    # Les fichiers de /assets/ portent un hash de leur contenu dans leur nom (build Vite) : ils ne
    # changent jamais. index.html (servi aussi pour toute route du front) est revalidé à chaque
    # chargement, pour toujours pointer vers les fichiers du build en ligne. Sans Cache-Control,
    # le navigateur appliquait un cache heuristique : le 07/10/2026, des index.html servis à la
    # place d'assets pendant une bascule d'instances y sont restés ~3 h.
    # Évalué après le repli de try_files, donc sur l'URI finale ; valeur vide = pas d'en-tête.
    map $uri $front_cache_control_by_uri {
        ~^/assets/      "public, max-age=31536000, immutable";
        /index.html     "no-cache";
        default         "";
    }
    # Erreurs (asset absent pendant une bascule, notamment) jamais conservées, même par un
    # intermédiaire : une 404 transitoire ne doit pas survivre au rechargement qui la rattrape
    map $status $front_cache_control {
        200             $front_cache_control_by_uri;
        206             $front_cache_control_by_uri;
        304             $front_cache_control_by_uri;
        default         "no-store";
    }

    server {
        listen       $PORT  default_server;
        root   $APP_HOME/build;
        index  index.html;

        # Aucun add_header dans les blocs location : un seul y annulerait tous ceux du serveur,
        # en-têtes de sécurité compris.
        add_header Cache-Control $front_cache_control always;

        # En-têtes de sécurité : même bloc dans devops/build/all/nginx.conf
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Directives sans effet sur le rendu : appliquées dès maintenant
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        # Politique cible (pas de 'unsafe-inline' dans script-src : bloque aussi les liens javascript:), en observation avant application.
        # Violations envoyées au projet Sentry de l'application (devops/build/csp-report.sh)
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://app.api-engagement.beta.gouv.fr; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.snu.gouv.fr https://*.beta-snu.dev https://*.cellar-c2.services.clever-cloud.com https://cellar-c2.services.clever-cloud.com https://sentry.incubateur.net https://api.api-engagement.beta.gouv.fr https://data.geopf.fr https://api-adresse.data.gouv.fr; frame-src 'self' https://player.vimeo.com; media-src 'self' blob: https:; worker-src 'self' blob:; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; report-uri $CSP_REPORT_URI" always;

        # Les sourcemaps sont envoyées à Sentry puis supprimées du build ; filet si un build les laisse
        location ~* \.map$ {
            return 404;
        }

        # Un asset absent est une 404, jamais index.html : servi en 200 text/html sous le nom d'un
        # module JS, il serait gardé en cache et refusé à l'exécution (nosniff)
        location /assets/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
