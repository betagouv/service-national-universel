daemon off;
error_log stderr;
pid $APP_HOME/nginx.pid;
worker_processes auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    access_log off;
    server_tokens off;
    server {
        listen       $PORT  default_server;

        # En-têtes de sécurité : même bloc dans devops/build/all/nginx.conf
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Directives sans effet sur le rendu : appliquées dès maintenant
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        # Politique cible (pas de 'unsafe-inline' dans script-src : bloque aussi les liens javascript:), en observation avant application.
        # Violations envoyées au projet Sentry de l'application (devops/build/csp-report.sh)
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://app.api-engagement.beta.gouv.fr; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.snu.gouv.fr https://*.beta-snu.dev https://*.cellar-c2.services.clever-cloud.com https://cellar-c2.services.clever-cloud.com https://sentry.incubateur.net https://api.api-engagement.beta.gouv.fr https://data.geopf.fr https://api-adresse.data.gouv.fr; frame-src 'self' https://player.vimeo.com; media-src 'self' blob: https:; worker-src 'self' blob:; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; report-uri $CSP_REPORT_URI" always;

        # Les sourcemaps sont envoyées à Sentry puis supprimées du build ; filet si un build les laisse
        location ~* \.map$ {
            return 404;
        }

        location / {
            root   $APP_HOME/build;
            index  index.html;
            try_files $uri /index.html;
        }
    }
}
