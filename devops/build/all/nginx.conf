daemon off;
error_log stderr;
pid $APP_HOME/nginx.pid;
worker_processes auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    access_log off;
    server_tokens off;
    client_body_temp_path $APP_HOME/nginx/client 1 2;
    proxy_temp_path $APP_HOME/nginx/proxy 1 2;

    server {
        listen $PORT;
        server_name moncompte.*;

        # En-têtes de sécurité : même bloc dans devops/build/front/nginx.conf
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Directives sans effet sur le rendu : appliquées dès maintenant
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        # Politique cible (pas de 'unsafe-inline' dans script-src : bloque aussi les liens javascript:), en observation avant application
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://plausible.io https://app.api-engagement.beta.gouv.fr; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.snu.gouv.fr https://*.beta-snu.dev https://*.cellar-c2.services.clever-cloud.com https://cellar-c2.services.clever-cloud.com https://sentry.incubateur.net https://plausible.io https://api.api-engagement.beta.gouv.fr https://data.geopf.fr https://api-adresse.data.gouv.fr; frame-src 'self' https://player.vimeo.com; media-src 'self' blob: https:; worker-src 'self' blob:; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

        # Les sourcemaps sont envoyées à Sentry puis supprimées du build ; filet si un build les laisse
        location ~* \.map$ {
            return 404;
        }

        location / {
            root   $APP_HOME/app/;
            index  index.html;
            try_files $uri /index.html;
        }
    }

    server {
        listen $PORT;
        server_name admin.*;

        # En-têtes de sécurité : même bloc dans devops/build/front/nginx.conf
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Directives sans effet sur le rendu : appliquées dès maintenant
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        # Politique cible (pas de 'unsafe-inline' dans script-src : bloque aussi les liens javascript:), en observation avant application
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://plausible.io https://app.api-engagement.beta.gouv.fr; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.snu.gouv.fr https://*.beta-snu.dev https://*.cellar-c2.services.clever-cloud.com https://cellar-c2.services.clever-cloud.com https://sentry.incubateur.net https://plausible.io https://api.api-engagement.beta.gouv.fr https://data.geopf.fr https://api-adresse.data.gouv.fr; frame-src 'self' https://player.vimeo.com; media-src 'self' blob: https:; worker-src 'self' blob:; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

        # Les sourcemaps sont envoyées à Sentry puis supprimées du build ; filet si un build les laisse
        location ~* \.map$ {
            return 404;
        }

        location / {
            root   $APP_HOME/admin/;
            index  index.html;
            try_files $uri /index.html;
        }
    }

    upstream api {
        server 127.0.0.1:3000;
    }

    upstream apiv2 {
        server 127.0.0.1:3001;
    }

    upstream tasks {
        server 127.0.0.1:3002;
    }

    upstream tasksv2 {
        server 127.0.0.1:3003;
    }

    server {
        listen $PORT default_server;

        location /v2 {
            proxy_pass http://apiv2;
            proxy_set_header Host $http_host;
        }
        
        location / {
            proxy_pass http://api;
            proxy_set_header Host $http_host;
        }

    }

    server {
        listen $PORT;
        server_name tasks.*;

        location / {
            proxy_pass http://tasks;
        }
    }

    server {
        listen $PORT;
        server_name tasksv2.*;

        location / {
            proxy_pass http://tasksv2;
        }
    }
}
